name: Terraform Validation

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "scripts/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.14.8"
  TF_WORKING_DIR: terraform/environments/production

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform Init
        run: terraform init -backend=false
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate -no-color
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: AWS stack static checks
        run: scripts/check-aws-stack.sh

      - name: Terraform Init and Validate (AWS environments)
        run: |
          for environment in aws-staging aws-production; do
            terraform -chdir="terraform/environments/$environment" init -backend=false -no-color
            terraform -chdir="terraform/environments/$environment" validate -no-color
          done

      - name: Terraform Tests
        run: terraform test
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: CS pilot source-only policy
        run: npm run test:cs-pilot-static
